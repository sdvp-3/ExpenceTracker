<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="index.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Expence Tracker</title>
  </head>
  <body>
    <main>
      
      <header>
        <div class="title">
          <img class="icon-image" src="pic/spending.png" />
          <p class="titles">Expense Tracker</p>
        </div>
        <div class="date">Noyabr 2026</div>
      </header>


      <div class="sections">
        <div class="balance">
          <p>Balance</p>
          <h1 id="h1-b" class="b"></h1>
        </div>
        <div class="income">
          <p>Income</p>
          <h1 id="h1-i" class="i"></h1>
        </div>
        <div class="transaction">
          <p>Expenses</p>
          <h1 id="h1-t" class="t"></h1>
        </div>
      </div>


      <div class="container">
        <div class="new-transaction">
          <h3>New Transactions</h3>
          <div class="item">
            <p>Description</p>
            <input id="input-item" type="text" placeholder="Example: lunch" />
          </div>

          <div class="in-balance">
            <p>Amount</p>
            <input id="input-num" type="number" placeholder="0" />
          </div>

          <div class="category-option">
            <p>Category</p>
            <select id="categorys" required>
              <option value="" disabled selected>All categories</option>
              <option value="food">Food</option>
              <option value="transport">Transport</option>
              <option value="bills">Bills</option>
              <option value="shopping">Shopping</option>
              <option value="other">Other</option>
            </select>
          </div>

             <div class="date">
            <p>Date</p>
            <input id="date-input" type="date">
          </div>

          <div class="type-container">
            <p>Type</p>
            <div class="typs">
              <button class="transac"  id="expens">Expense</button>
              <button class="incom" id="incom">Income</button>
            </div>
          </div>

          <div class="add-btn"><button id="btn-add">+Add</button></div>
        </div>


        <div class="transaction-container">
          <h3>Transactions</h3>
          <div class="heads-container">
            <div class="buttons">
              <button id="all-btn">All</button>
              <button id="incom-btn">Income</button>
              <button id="trasac-btn">Expenses</button>
            </div>


            <select id="categorys-1" required>
              <option value="" disabled selected>All categories</option>
              <option value="food">Food</option>
              <option value="transport">Transport</option>
              <option value="bills">Bills</option>
              <option value="shopping">Shopping</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="cards" id="transaction-list"><p id="empty-msg">No transactions yet</p></div>
         

        </div>



        <div class="category">
          <h3>Category Summary</h3>

          <p id="category-empty">No expenses yet</p>

          <div id="category-list"></div>
          <div id="category-top"></div>
        </div>


      </div>


    </main>
    <script src="index.js"></script>
  </body>
</html>
